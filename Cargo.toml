[package]
name = "video-dedup"
version = "0.1.0"
edition = "2021"

[dependencies]
# CLI Argument Parser
clap = { version = "4.4", features = ["derive"] }
walkdir = "2.4"

# Multi-threading library for parallel video processing
rayon = "1.8"

# FFmpeg bindings (Safe wrapper around libav*)
ffmpeg-next = "6.0"

# Embedded key-value database for caching signatures
sled = "0.34"

# Fast serialization for saving/loading hashes
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# --- NEW: Error Handling & Logging ---
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
indicatif = "0.17"