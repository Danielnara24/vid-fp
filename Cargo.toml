[package]
name = "vid-fp"
version = "0.32.0"
edition = "2021"
rust-version = "1.85"
description = "Fast video duplicate and clip finder using perceptual keyframe fingerprints"
authors = ["Danielnara24"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Danielnara24/vid-fp"
homepage = "https://github.com/Danielnara24/vid-fp"
readme = "README.md"
keywords = ["video", "duplicate", "deduplication", "fingerprint", "cli"]
categories = ["command-line-utilities", "multimedia::video"]
exclude = ["tests/fixtures/*"]

[[bin]]
name = "vid-fp"
path = "src/main.rs"

[features]
# Link FFmpeg and dav1d statically, from the prefix named by FFMPEG_DIR.
#
# Deliberately NOT ffmpeg-next/build. That feature git-clones FFmpeg into
# OUT_DIR and builds it with a configure line we cannot influence -- which is
# how it ends up with the hwaccel-only AV1 decoder and no libdav1d, producing a
# binary that cannot fingerprint a single AV1 file. `static` instead links a
# prefix that scripts/build-ffmpeg-static.sh built to our specification; build.rs
# refuses the build if FFMPEG_DIR is unset rather than silently falling back to
# the system's shared FFmpeg.
static-ffmpeg = ["ffmpeg-next/static"]

[dependencies]
# CLI Argument Parser
clap = { version = "4.4", features = ["derive"] }
clap_complete = "4.6"
clap_mangen = "0.3"
walkdir = "2.4"

# Graceful Ctrl-C. The handler runs on its own thread (not in async-signal
# context), so it can print and force-exit safely. "termination" also covers
# SIGTERM/SIGHUP — drop that feature if you want SIGINT only.
ctrlc = { version = "3.4", features = ["termination"] }

# Multi-threading library for parallel video processing
rayon = "1.8"

# Direct libc access for glibc allocator tuning (mallopt) on Linux
libc = "0.2"

# FFmpeg bindings (Safe wrapper around libav*).
#
# The crate's major.minor tracks FFmpeg's, but only its FORWARD compatibility is
# broken: 8.1 builds and runs correctly against system FFmpeg 6, 7 and 8 headers
# (ffmpeg-sys-next detects the version and gates the wrapper on cfgs), while the
# 6.x crate fails to compile against FFmpeg 7 headers with ~30 errors inside the
# dependency itself. Pinning the newest therefore widens the range of hosts a
# `cargo install` works on rather than narrowing it -- do not "fix" this back
# down to match whatever the release binary vendors.
#
# Only codec, format and swscale are used. The default feature set also pulls in
# avdevice and avfilter, which drag libavdevice/libavfilter (and their own tails:
# libavc1394, libncursesw) into DT_NEEDED for nothing. ffmpeg-next's
# init_device/init_filter are cfg-gated no-ops when the features are off.
ffmpeg-next = { version = "8.1", default-features = false, features = [
    "codec",
    "format",
    "software-scaling",
] }

# Embedded key-value database for caching signatures
redb = "2"

# Fast serialization for saving/loading hashes
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
# `preserve_order` so a JSON report comes out in the order export.rs writes it
# rather than alphabetically. Without it serde_json's Map is a BTreeMap, which
# interleaves the raw and formatted halves of every figure and buries `summary`
# after the whole results array -- the key order is part of the report's design,
# so it has to survive serialization.
serde_json = { version = "1.0", features = ["preserve_order"] }

# Error Handling & Logging
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
indicatif = "0.17"

# Robust CSV Exporting
csv = "1.3"

# Recoverable deletion via the FreeDesktop.org trash spec (Linux)
trash = "5"

[build-dependencies]
# Only used by the static-ffmpeg path, to read the link flags (libdav1d, libz)
# off the static prefix's own .pc files. Already in the tree as an
# ffmpeg-sys-next build dependency, so it costs no extra download.
pkg-config = "0.3"

[dev-dependencies]
tempfile = "3.8"

# Smaller, faster release binaries. `strip` removes debug symbols; `lto` and a
# single codegen unit trade compile time for runtime speed and size.
[profile.release]
lto = true
codegen-units = 1
strip = true
