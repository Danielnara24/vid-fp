# .github/workflows/release.yml
#
# Builds a release binary and attaches it to a GitHub Release when you push a
# version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
#
# Each release publishes the same binary under TWO names:
#   vid-fp-<version>-x86_64-linux-gnu  -> archival, one per release
#   vid-fp-x86_64-linux-gnu            -> stable name, so this URL always works:
#     https://github.com/Danielnara24/vid-fp/releases/latest/download/vid-fp-x86_64-linux-gnu
#
# The binary is dynamically linked and requires FFmpeg 6.x installed on the
# target machine (`apt install ffmpeg`, `pacman -S ffmpeg`, etc).

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required to create/update the GitHub Release

jobs:
  build-gnu:
    name: Dynamic glibc binary (needs FFmpeg installed)
    runs-on: ubuntu-24.04 # 24.04 ships FFmpeg 6.x, matching ffmpeg-next 6.x
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg dev libraries
        # ffmpeg-sys-next links the FULL family; missing any one makes pkg-config
        # fail with "Package 'libav...' not found".
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libavcodec-dev libavformat-dev libavutil-dev \
            libavfilter-dev libavdevice-dev \
            libswscale-dev libswresample-dev \
            clang pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: gnu-dynamic

      - name: Build
        run: cargo build --release --locked

      - name: Package artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          # Same binary, two names: a versioned copy for history and a stable
          # copy so the /releases/latest/download/ URL never changes.
          cp "target/release/vid-fp" "dist/vid-fp-${VERSION}-x86_64-linux-gnu"
          cp "target/release/vid-fp" "dist/vid-fp-x86_64-linux-gnu"
          ( cd dist
            for f in "vid-fp-${VERSION}-x86_64-linux-gnu" "vid-fp-x86_64-linux-gnu"; do
              sha256sum "$f" > "$f.sha256"
            done )

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*