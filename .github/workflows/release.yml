# .github/workflows/release.yml
#
# Builds a release binary and attaches it to a GitHub Release when you push a
# version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
#
# This version ships ONE artifact: a dynamically-linked glibc binary.
#   x86_64-linux-gnu -> requires FFmpeg 6.x libraries installed on the target
#                       machine (`apt install ffmpeg`, `pacman -S ffmpeg`, etc).
#
# The static musl binary (FFmpeg compiled in, zero runtime deps) is intentionally
# left out for now — compiling FFmpeg from source under musl is slow and brittle,
# and it was blocking releases. Add it back once it builds reliably.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required to create/update the GitHub Release

jobs:
  build-gnu:
    name: Dynamic glibc binary (needs FFmpeg installed)
    runs-on: ubuntu-24.04 # 24.04 ships FFmpeg 6.x, matching ffmpeg-next 6.x
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg dev libraries
        # ffmpeg-sys-next links the FULL family. Missing any one of these makes
        # pkg-config fail with "Package 'libav...' not found". libavdevice-dev
        # pulls in most of the others, but list them all so it's obvious.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libavcodec-dev libavformat-dev libavutil-dev \
            libavfilter-dev libavdevice-dev \
            libswscale-dev libswresample-dev \
            clang pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: gnu-dynamic

      - name: Build
        run: cargo build --release --locked

      - name: Package artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="vid-fp-${VERSION}-x86_64-linux-gnu"
          mkdir -p dist
          cp "target/release/vid-fp" "dist/${NAME}"
          ( cd dist && sha256sum "${NAME}" > "${NAME}.sha256" )

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*